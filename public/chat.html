<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noah · 研究预览</title><meta name="description" content="Noah independently trained model research preview"><link rel="icon" href="/mark.svg"><link rel="stylesheet" href="/style.css"><script src="/chat.js" type="module"></script></head><body class="public-app"><main><header><a class="brand" href="/" aria-label="Noah home"><img src="/mark.svg" alt="" width="32" height="32"><strong>Noah</strong></a><div class="header-right"><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="es">Español</option><option value="ar">العربية</option></select><button class="secondary" id="new-chat" data-i18n="newChat">新对话</button></div></header><section id="view-chat" class="view active"><div class="welcome" id="welcome"><div class="eyebrow"><span></span><span data-i18n="heroEyebrow">NOAH · 独立 AI 工作空间</span></div><img class="noah-emblem" src="/mark.svg" width="48" height="48" alt=""><h1 data-i18n="hello">今天，想一起探索什么？</h1><p class="subtitle" data-i18n="heroSubtitle">从一个问题开始，让思路更清晰。</p><div class="stage-notice"><span>◉</span><span data-i18n="capabilityNotice">训练早期：当前提供真实文本生成实验，尚不具备可靠问答能力。</span></div></div><div id="messages" class="messages" aria-live="polite"></div><div class="composer-wrap"><form id="chat-form" class="composer"><textarea id="prompt" rows="2" maxlength="600" data-i18n-placeholder="promptPlaceholder" placeholder="给 Noah 一段文字，看看它的续写…" aria-label="Message"></textarea><div class="composer-bottom"><span class="model-tag"><span class="dot"></span>Noah<small data-i18n="experimental">Seed · 实验权重</small></span><button type="submit" id="send" aria-label="Send">↑</button></div></form><p class="composer-note" data-i18n="chatFootnote">仅由 Noah 自有权重生成。聊天不会自动加入训练，生成内容可能没有意义。</p></div></section><footer><span>NOAH · ZENITHSMART</span><span data-i18n="footerStage">研究原型 · 能力如实呈现</span></footer></main><aside id="companion" class="companion is-collapsed" aria-label="Noah interface companion"><button id="companion-toggle" class="companion-toggle" aria-expanded="false"><span class="companion-dot"></span><span data-i18n="companionName">界面伙伴</span><span id="companion-chevron">⌃</span></button><div class="companion-body"><div class="companion-note"><span data-i18n="companionHint">陪伴界面，不参与模型生成。</span><button id="companion-pause" aria-label="Pause companion animation">Ⅱ</button></div><button id="companion-greet" class="companion-character" aria-label="Greet companion"><img src="/companion.png" alt="Silver-haired blue crystal fantasy companion" class="companion-art"></button><div id="companion-status" class="companion-status" data-i18n="companionIdle">待命中</div></div></aside><div class="toast" id="toast" role="status"></div></body></html>
